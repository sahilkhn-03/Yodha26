<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartbeat Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .monitor {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .bpm-display {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }
        .bpm-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }
        .bpm-value {
            font-size: 72px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .bpm-label {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
            margin-top: 10px;
        }
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .metric {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        .metric-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        /* DATA LABELING SECTION */
        .labeling-section {
            background: #f0f9ff;
            border: 2px solid #667eea;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }
        .labeling-title {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }
        .stress-input {
            margin: 15px 0;
        }
        .stress-input label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        .stress-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            min-width: 70px;
            text-align: center;
        }
        .btn-record {
            background: #00c851;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn-record:hover {
            background: #00a844;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,200,81,0.3);
        }
        .dataset-stats {
            background: #fff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #e0e0e0;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 500;
            text-align: center;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-start {
            background: #10b981;
            color: white;
        }
        .btn-start:hover { background: #059669; transform: translateY(-2px); }
        .btn-stop {
            background: #ef4444;
            color: white;
        }
        .btn-stop:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-stress {
            background: #f59e0b;
            color: white;
        }
        .btn-stress:hover { background: #d97706; transform: translateY(-2px); }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 600;
        }
        .status-stopped { background: #fee2e2; color: #991b1b; }
        .status-running { background: #d1fae5; color: #065f46; }
        .heartbeat-icon {
            display: inline-block;
            animation: heartbeat 1s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="monitor">
        <h1>🫀 Heartbeat Monitor</h1>
        
        <div class="bpm-display">
            <div class="bpm-value" id="bpm">--</div>
            <div class="bpm-label">Beats Per Minute</div>
        </div>
        
        <div class="metrics">
            <div class="metric">
                <div class="metric-value" id="variability">--</div>
                <div class="metric-label">Variability</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="stress">--</div>
                <div class="metric-label">Stress Level</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-start" onclick="startSimulation()">▶️ Start</button>
            <button class="btn-stress" onclick="triggerStress()">⚡ Stress</button>
            <button class="btn-stop" onclick="stopSimulation()">⏹️ Stop</button>
        </div>
        
        <div id="status" class="status status-stopped">
            ⚫ Simulation Stopped
        </div>
        
        <!-- AUTO DATA COLLECTION SECTION -->
        <div class="labeling-section">
            <div class="labeling-title">🤖 Auto Dataset Collection</div>
            
            <div style="text-align: center; margin: 20px 0;">
                <label style="display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="autoCollect" onchange="toggleAutoCollect()" style="width: 20px; height: 20px;">
                    <span style="font-size: 18px; font-weight: bold;">Enable Auto-Collection</span>
                </label>
                <p style="margin-top: 10px; color: #666; font-size: 14px;">
                    Automatically saves data every 2 seconds while monitoring
                </p>
            </div>
            
            <div id="recordMessage"></div>
            
            <div class="dataset-stats">
                <div style="font-weight: bold; margin-bottom: 10px; text-align: center;">Dataset Stats</div>
                <div class="stat-row">
                    <span>Total Samples:</span>
                    <span id="totalSamples">0</span>
                </div>
                <div class="stat-row">
                    <span>Normal (≤0.5):</span>
                    <span id="normalCount">0</span>
                </div>
                <div class="stat-row">
                    <span>Abnormal (>0.5):</span>
                    <span id="abnormalCount">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        const API_BASE = 'http://localhost:8001';
        let currentBPM = 0;
        let currentVariability = 0;
        let currentStress = 0;

        async function startSimulation() {
            try {
                const res = await fetch(`${API_BASE}/simulation/start`, { method: 'POST' });
                const data = await res.json();
                updateStatus('running', '🟢 Simulation Running');
                connectWebSocket();
            } catch (error) {
                alert('Error starting simulation. Is the server running?');
            }
        }

        async function stopSimulation() {
            try {
                await fetch(`${API_BASE}/simulation/stop`, { method: 'POST' });
                updateStatus('stopped', '⚫ Simulation Stopped');
                if (ws) ws.close();
            } catch (error) {
                alert('Error stopping simulation');
            }
        }

        async function triggerStress() {
            try {
                await fetch(`${API_BASE}/simulation/stress-test`, { method: 'POST' });
            } catch (error) {
                console.error('Error triggering stress');
            }
        }

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8001/ws/heartbeat');
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'connected') return;
                
                currentBPM = data.bpm;
                currentVariability = data.variability;
                currentStress = data.stress_level;
                
                document.getElementById('bpm').textContent = currentBPM;
                document.getElementById('variability').textContent = currentVariability.toFixed(3);
                document.getElementById('stress').textContent = currentStress.toFixed(3);
                
                // Color code stress level
                const stressEl = document.getElementById('stress');
                if (data.stress_level > 0.5) {
                    stressEl.style.color = '#dc2626';
                } else if (data.stress_level > 0.3) {
                    stressEl.style.color = '#f59e0b';
                } else {
                    stressEl.style.color = '#667eea';
                }
            };
            
            ws.onerror = () => {
                updateStatus('stopped', '⚫ Connection Error');
            };
            
            ws.onclose = () => {
                updateStatus('stopped', '⚫ Disconnected');
            };
        }

        function updateStatus(state, text) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = text;
            statusEl.className = `status status-${state}`;
        }
        
        // DATA LABELING FUNCTIONS
        let autoCollectInterval = null;
        let autoCollectEnabled = false;
        
        function toggleAutoCollect() {
            autoCollectEnabled = document.getElementById('autoCollect').checked;
            
            if (autoCollectEnabled) {
                if (currentBPM === 0) {
                    showMessage('Start simulation first!', 'error');
                    document.getElementById('autoCollect').checked = false;
                    autoCollectEnabled = false;
                    return;
                }
                
                showMessage('✅ Auto-collection ENABLED', 'success');
                autoCollectInterval = setInterval(autoRecordSample, 2000);
            } else {
                showMessage('⏸️ Auto-collection PAUSED', 'error');
                if (autoCollectInterval) {
                    clearInterval(autoCollectInterval);
                    autoCollectInterval = null;
                }
            }
        }
        
        async function autoRecordSample() {
            if (currentBPM === 0 || !autoCollectEnabled) return;
            
            try {
                const response = await fetch('http://localhost:8000/api/training/record', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bpm: currentBPM,
                        stress_level: currentStress,
                        systolic: null,
                        diastolic: null,
                        session_id: null,
                        notes: `Auto-collected, Var: ${currentVariability.toFixed(3)}`
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    updateStats();
                }
            } catch (error) {
                console.error('Auto-record failed:', error);
            }
        }
        
        async function updateStats() {
            try {
                const response = await fetch('http://localhost:8000/api/training/stats');
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('totalSamples').textContent = data.total_samples;
                    document.getElementById('normalCount').textContent = data.normal_samples;
                    document.getElementById('abnormalCount').textContent = data.stress_samples;
                }
            } catch (error) {
                console.error('Failed to update stats:', error);
            }
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('recordMessage');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            setTimeout(() => messageDiv.textContent = '', 3000);
        }
        
        // Update stats on load and periodically
        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>
</html>
